name: local-ai

services:
  ollama:
    image: ${OLLAMA_IMAGE:?Copy .env.example to .env first}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-8192}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-15m}"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      ai:
        aliases:
          - ollama
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  model:
    image: ${OLLAMA_IMAGE:?Copy .env.example to .env first}
    profiles: ["bootstrap"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${LOCAL_AI_MODEL:?Set LOCAL_AI_MODEL in .env or a profile file}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai
    restart: "no"

  whisper:
    build:
      context: .
      dockerfile: whisper/Dockerfile
      args:
        WHISPER_BASE_IMAGE: ${WHISPER_IMAGE:?Copy .env.example to .env first}
    environment:
      WHISPER_MODEL: "${WHISPER_MODEL:-base}"
      WHISPER_LANGUAGE: "${WHISPER_LANGUAGE:-de}"
      WHISPER_THREADS: "${WHISPER_THREADS:-4}"
    volumes:
      - whisper_models:/models
    working_dir: /tmp
    networks:
      ai:
        aliases:
          - whisper
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  ollama_data:
  whisper_models:

networks:
  ai:
    name: local-ai
    driver: bridge
