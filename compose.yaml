name: stockroom

services:
  app:
    image: ${STOCKROOM_IMAGE:-stockroom:local}
    build:
      context: .
      args:
        VERSION: ${STOCKROOM_VERSION:-local}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      DATABASE_PATH: /data/stockroom.db
      LISTEN_ADDR: :8080
      LOG_FORMAT: json
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - stockroom_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/stockroom", "healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

volumes:
  stockroom_data:
