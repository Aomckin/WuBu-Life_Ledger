[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhaoxi-wubu-tool"
version = "0.1.1"
description = "物簿事件 API 的朝汐工具包"
requires-python = ">=3.12"
dependencies = ["zhaoxi>=1.4.7,<2", "pydantic>=2.8,<3"]

[project.entry-points."zhaoxi.tools"]
wubu = "wubu_tool.package:create_package"

[tool.setuptools]
packages = ["wubu_tool"]

[tool.setuptools.package-data]
wubu_tool = ["api_schema.json"]
