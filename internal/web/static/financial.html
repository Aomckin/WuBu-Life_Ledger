<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>物簿 · 财务收件箱</title><link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/ledger.css">
<link rel="stylesheet" href="/assets/financial.css"><script src="/assets/financial.js?v=1.0.1" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="/">物簿 · 财务收件箱</a><a href="/">返回账簿</a></header>
<main class="page-shell">
<h1>财务收件箱</h1><div id="financial-message" role="status"></div>
<nav class="ledger-nav" aria-label="流水视图">
<button data-tab="review" class="button">待确认</button><button data-tab="booked" class="button">已入账</button><button data-tab="processed" class="button">已处理证据</button>
<details><summary>更多</summary><button data-tab="unannotated" class="button">未补全说明</button><button data-tab="semantic-evidence" class="button">未匹配语义证据</button><button data-tab="health" class="button">账户对账状态</button></details>
</nav>
<form id="financial-booked-search" class="ledger-search" hidden><label>查找已入账流水<input id="financial-search" maxlength="200" placeholder="商家或说明"></label><button class="button">搜索</button></form>
<section id="financial-content" aria-live="polite"></section>
<div id="financial-pages"><button id="financial-newer" class="button">较新记录</button><span id="financial-page"></span><button id="financial-older" class="button">更早记录</button></div>
</main>
<dialog id="financial-dialog" aria-labelledby="financial-title">
<form id="review-form"><h2 id="financial-title"></h2><div id="financial-fields"></div><p id="financial-error" role="alert"></p><button type="submit" class="button button-primary">确认</button><button type="button" id="financial-cancel" class="button">取消</button></form>
</dialog>
</body>
</html>
