<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>物簿 · 生活账簿</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/app.css?v=v03-1"><link rel="stylesheet" href="/assets/ledger.css?v=v03-1"><script src="/assets/zh.js?v=v03-1" defer></script><script src="/assets/cashflow.js?v=v03-1" defer></script><script src="/assets/living.js?v=v03-1" defer></script><script src="/assets/runway.js?v=v03-1" defer></script><script src="/assets/ledger.js?v=v03-1" defer></script></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark material-symbols">inventory_2</span><span><strong>物簿</strong><small>生活账簿 · v0.3</small></span></a><div class="topbar-actions"><a class="button button-secondary" href="/inventory">编辑库存</a><button class="button button-primary" id="new-purchase">记一笔购买</button></div></header>
<main class="page-shell"><section class="hero"><div><p class="eyebrow">钱与物的生命周期</p><h1>让生活跑得更远。</h1><p class="hero-copy">一次记录，让钱、物、库存与历史同步更新。</p></div><label>账簿月份 <input id="month" type="month"></label></section>
<div id="message" role="status" aria-live="polite"></div><section id="metrics" class="metrics" aria-label="本月概览"></section>
<nav class="ledger-nav" aria-label="账簿栏目"><button data-view="home" class="button is-active">首页</button><button data-view="living" class="button">生活约束</button><button data-view="accounts" class="button">账户</button><button data-view="transactions" class="button">资金流水</button><button data-view="durables" class="button">耐用品</button><button data-view="import" class="button">导入</button><button data-view="inventory" class="button">库存</button><button data-view="items" class="button">物品</button><button data-view="purchases" class="button">购买记录</button><button data-view="expenses" class="button">消费记录</button><button data-view="maintenance" class="button">维护记录</button><button data-view="history" class="button">历史</button></nav>
<section id="content" aria-live="polite"></section><div id="paging" hidden><button id="previous" class="button">上一页</button><span id="page-label"></span><button id="next" class="button">下一页</button></div>
<footer class="ledger-footer">由朝汐调用事件 API，物簿保存现实的来龙去脉。 <a href="/api/v1/openapi.json">接口文档</a> · <a href="/inbox">库存收件箱</a></footer></main>
<dialog id="purchase-dialog"><form id="purchase-form"><div class="dialog-head"><h2 id="purchase-title">记录购买</h2><button type="button" data-close="purchase-dialog" aria-label="关闭">×</button></div><div class="form-grid"><label>商家（选填）<input name="merchant" maxlength="200"></label><label>购买时间<input name="purchased_at" type="datetime-local" required></label><label>实际付款（元）<input name="total_amount" type="number" min="0" step="0.01" required></label><label>优惠（元）<input name="discount" type="number" min="0" step="0.01" value="0" required></label><label>附加费用（元）<input name="extra_fee" type="number" min="0" step="0.01" value="0" required></label><label>付款账户<select name="account_id" id="purchase-account"><option value="">默认付款账户</option></select></label><label>付款方式<input name="payment_method" maxlength="100"></label><label>费用分类<select name="category"><option value="food">饮食</option><option value="household">生活用品</option><option value="transport">交通</option><option value="other">其他</option></select></label><label>支出性质<select name="expense_nature"><option value="">未分类</option><option value="DAILY">日常</option><option value="FIXED">固定</option><option value="SETUP">安家</option><option value="CAPITAL">耐用品投入</option><option value="EXCEPTIONAL">特殊事件</option></select></label><label>备注<input name="note" maxlength="2000"></label></div><p class="helper">商品名、包装规格、数量和单位分别填写。例如：无糖可乐，规格 2L，数量 1，单位“瓶”。实际付款可与商品合计不同；耐用品每件单独一行。</p><div id="purchase-lines"></div><button type="button" class="button button-secondary" id="add-line">＋ 商品</button><div class="dialog-actions"><button type="button" class="button button-secondary" data-close="purchase-dialog">取消</button><button class="button button-primary" id="save-purchase" type="submit">保存整笔购买</button></div><p class="form-error" id="purchase-error" role="alert"></p></form></dialog>
<dialog id="action-dialog"><form id="action-form"><div class="dialog-head"><h2 id="action-title"></h2><button type="button" data-close="action-dialog" aria-label="关闭">×</button></div><div id="action-fields"></div><div class="dialog-actions"><button class="button button-primary" type="submit">确认记录</button></div><p class="form-error" id="action-error" role="alert"></p></form></dialog>
<dialog id="detail-dialog"><div class="dialog-head"><h2 id="detail-title"></h2><button type="button" data-close="detail-dialog" aria-label="关闭">×</button></div><div id="detail-content"></div></dialog>
<datalist id="purchase-units"></datalist>
<dialog id="purchase-delete-dialog" aria-labelledby="purchase-delete-title"><div class="dialog-head"><h2 id="purchase-delete-title">删除购买记录？</h2><button type="button" data-close="purchase-delete-dialog" aria-label="关闭">×</button></div><p id="purchase-delete-summary"></p><p class="helper">删除后会撤销本笔费用及对应的库存增加，保留操作历史。已有消耗导致库存不足时，将提示核对。</p><p id="purchase-delete-error" class="form-error" role="alert"></p><div class="dialog-actions"><button class="button button-secondary" data-close="purchase-delete-dialog">取消</button><button class="button button-danger" id="confirm-purchase-delete">确认删除</button></div></dialog>
<dialog id="cash-dialog"><form id="cash-form"><div class="dialog-head"><h2 id="cash-title"></h2><button type="button" data-close="cash-dialog" aria-label="关闭">×</button></div><div id="cash-fields" class="form-grid"></div><div class="dialog-actions"><button class="button button-primary" type="submit">确认记录</button></div><p id="cash-error" class="form-error" role="alert"></p></form></dialog>
</body></html>
