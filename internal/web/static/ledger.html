<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>物簿 · 生活账簿</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/app.css?v=v03-1"><link rel="stylesheet" href="/assets/ledger.css?v=1.0.1"><script src="/assets/zh.js?v=v03-1" defer></script><script src="/assets/cashflow.js?v=1.0.1" defer></script><script src="/assets/living.js?v=v03-1" defer></script><script src="/assets/runway.js?v=v03-1" defer></script><script src="/assets/ledger.js?v=1.0.1" defer></script></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark material-symbols">inventory_2</span><span><strong>物簿</strong><small>生活账簿 · v1.0.1</small></span></a><div class="topbar-actions"><a class="button button-secondary" href="/inventory">编辑库存</a><button class="button button-primary" id="new-purchase">记购入</button></div></header>
<main class="page-shell"><section class="hero"><div><h1>生活账簿</h1><div class="ledger-actions" aria-label="快速记录"><button class="button" data-cash-action="expense">记支出</button><button class="button" data-cash-action="income">记收入</button><a class="button" href="/weekly-sync">每周同步</a><a class="button" href="/financial-inbox">待确认</a></div></div><label>账簿月份 <input id="month" type="month"></label></section>
<div id="message" role="status" aria-live="polite"></div>
<nav class="ledger-nav" aria-label="账簿栏目"><button data-view="home" class="button is-active">首页</button><button data-view="accounts" class="button">账户</button><button data-view="transactions" class="button">资金流水</button><button data-view="inventory" class="button">库存</button><button data-view="items" class="button">物品</button><details class="ledger-more"><summary>更多</summary><div class="ledger-actions"><button data-view="living" class="button">生活约束</button><button data-view="durables" class="button">耐用品</button><button data-view="purchases" class="button">购买记录</button><button data-view="expenses" class="button">消费记录</button><button data-view="maintenance" class="button">维护记录</button><button data-view="history" class="button">历史</button></div></details></nav>
<section id="content" aria-live="polite"></section><div id="paging" hidden><button id="previous" class="button">上一页</button><span id="page-label"></span><button id="next" class="button">下一页</button></div>
<footer class="ledger-footer">由朝汐调用事件 API，物簿保存现实的来龙去脉。 <a href="/api/v1/openapi.json">接口文档</a> · <a href="/inbox">库存收件箱</a> · <a href="/financial-inbox">财务收件箱</a></footer></main>
<dialog id="purchase-dialog"><form id="purchase-form"><div class="dialog-head"><h2 id="purchase-title">记录购买</h2><button type="button" data-close="purchase-dialog" aria-label="关闭">×</button></div><div id="purchase-lines"></div><details id="purchase-options"><summary>购买时间、商家和备注</summary><div class="form-grid"><label>购买时间<input name="purchased_at" type="datetime-local" required></label><label>商家<input name="merchant" maxlength="200"></label><label>备注<input name="note" maxlength="2000"></label></div></details><button type="button" class="button button-secondary" id="add-line">＋ 商品</button><div class="dialog-actions"><button type="button" class="button button-secondary" data-close="purchase-dialog">取消</button><button class="button button-primary" id="save-purchase" type="submit">保存购入</button></div><p class="form-error" id="purchase-error" role="alert"></p></form></dialog>
<dialog id="action-dialog"><form id="action-form"><div class="dialog-head"><h2 id="action-title"></h2><button type="button" data-close="action-dialog" aria-label="关闭">×</button></div><div id="action-fields"></div><div class="dialog-actions"><button class="button button-primary" type="submit">确认记录</button></div><p class="form-error" id="action-error" role="alert"></p></form></dialog>
<dialog id="detail-dialog"><div class="dialog-head"><h2 id="detail-title"></h2><button type="button" data-close="detail-dialog" aria-label="关闭">×</button></div><div id="detail-content"></div></dialog>
<datalist id="purchase-units"></datalist>
<dialog id="purchase-delete-dialog" aria-labelledby="purchase-delete-title"><div class="dialog-head"><h2 id="purchase-delete-title">删除购买记录？</h2><button type="button" data-close="purchase-delete-dialog" aria-label="关闭">×</button></div><p id="purchase-delete-summary"></p><p class="helper">删除后撤销对应的库存增加，保留操作历史。已有消耗导致库存不足时，将提示核对。</p><p id="purchase-delete-error" class="form-error" role="alert"></p><div class="dialog-actions"><button class="button button-secondary" data-close="purchase-delete-dialog">取消</button><button class="button button-danger" id="confirm-purchase-delete">确认删除</button></div></dialog>
<dialog id="cash-dialog"><form id="cash-form"><div class="dialog-head"><h2 id="cash-title"></h2><button type="button" data-close="cash-dialog" aria-label="关闭">×</button></div><div id="cash-fields" class="form-grid"></div><div class="dialog-actions"><button class="button button-primary" type="submit">确认记录</button></div><p id="cash-error" class="form-error" role="alert"></p></form></dialog>
</body></html>
